<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page Flip Book</title>
<style>
/* Original reference implementation for the page-flip-book skill. Pages are drawn with CSS only (no image files). */
:root { --desk: #e9e3d6; --paper: #f7f2e7; --ink: #2b2721; --soft: rgba(43,39,33,.55); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --desk: #1c1a17; --paper: #efe8d9; --ink: #2b2721; --soft: rgba(43,39,33,.55); } }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--desk); font-family: Georgia, "Times New Roman", serif; color: var(--ink); display: grid; place-items: center; overflow: hidden; touch-action: none; }
.stage { width: min(92vw, 980px); aspect-ratio: 2 / 1.32; perspective: 1800px; perspective-origin: 50% 45%; position: relative; }
.book { position: absolute; inset: 0; transform-style: preserve-3d; }
.half { position: absolute; top: 0; bottom: 0; width: 50%; overflow: hidden; background: var(--paper); box-shadow: 0 18px 40px rgba(0,0,0,.18); }
.half.left { left: 0; border-radius: 6px 0 0 6px; }
.half.right { right: 0; border-radius: 0 6px 6px 0; }
.half.left::after, .half.right::after { content: ""; position: absolute; top: 0; bottom: 0; width: 14%; pointer-events: none; }
.half.left::after { right: 0; background: linear-gradient(90deg, transparent, rgba(0,0,0,.14)); }   /* gutter shade */
.half.right::after { left: 0; background: linear-gradient(270deg, transparent, rgba(0,0,0,.14)); }
/* one full spread is a single picture; each half shows its side of it via background-position */
.art { position: absolute; top: 0; height: 100%; width: 200%; }
.half.left .art { left: 0; } .half.right .art { right: 0; }
/* the turning leaf: a chain of nested strips; each child rotates a little more than its parent */
.curl { position: absolute; top: 0; bottom: 0; width: 50%; transform-style: preserve-3d; pointer-events: none; }
.curl.next { left: 50%; } .curl.prev { right: 50%; }
.strip { position: absolute; top: 0; bottom: 0; transform-style: preserve-3d; }
.curl.next .strip { transform-origin: left center; } .curl.prev .strip { transform-origin: right center; }
.curl.next > .strip { left: 0; } .curl.prev > .strip { right: 0; }
.curl.next .strip .strip { left: 100%; } .curl.prev .strip .strip { right: 100%; }
.face { position: absolute; top: 0; bottom: 0; left: -0.75px; right: -0.75px; overflow: hidden;   /* sub-pixel overlap hides strip seams */ backface-visibility: hidden; -webkit-backface-visibility: hidden; background: var(--paper); }
.face.back { transform: rotateY(180deg); }
.face .art { width: auto; }
.face .sh { position: absolute; inset: 0; background: #000; opacity: 0; }     /* shade by angle to the light */
.face .gl { position: absolute; inset: 0; background: #fff; opacity: 0; mix-blend-mode: soft-light; }   /* specular wash */
.hint { position: fixed; bottom: 18px; left: 0; right: 0; text-align: center; font-size: 14px; color: var(--soft); letter-spacing: .06em; }
@media (prefers-color-scheme: dark) { .hint { color: rgba(239,232,217,.6); } }
/* the spreads (stand-ins for illustrations): a framed title and a plate per page */
.sp { position: absolute; inset: 0; }
.sp .pg { position: absolute; top: 7%; bottom: 7%; width: 40%; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
.sp .pg.l { left: 5%; } .sp .pg.r { right: 5%; }
.sp h2 { font-weight: 400; font-style: italic; font-size: clamp(18px, 3vw, 34px); margin: 0 0 .4em; }
.sp p { font-size: clamp(11px, 1.4vw, 15px); line-height: 1.6; color: var(--soft); max-width: 22em; margin: 0; }
.sp .plate { width: 78%; aspect-ratio: 4 / 3; border-radius: 4px; box-shadow: inset 0 0 0 1px rgba(43,39,33,.12); }
.sp .no { position: absolute; bottom: 4%; font-size: 11px; color: var(--soft); letter-spacing: .2em; }
.sp .pg.l .no { left: 0; } .sp .pg.r .no { right: 0; }
</style>
</head>
<body>
<div class="stage" id="stage"><div class="book" id="book"></div></div>
<div class="hint">Drag or throw a page · arrow keys turn</div>
<script>
// —— content: each spread is one HTML picture; pages are its halves ——
const SPREADS = [
  ['A sketchbook', 'Drag the right page to the left. The leaf bends like paper, because it is built from many thin strips.', 'linear-gradient(160deg,#c9d8c5,#8fb19a 55%,#4f7d68)'],
  ['Harbour at dawn', 'Each strip turns a few degrees more than the one before it, so the page curves instead of swinging like a door.', 'linear-gradient(180deg,#f3c7a0,#e79a7a 40%,#6f8fb5 41%,#36577f)'],
  ['The old market', 'Every strip carries a slice of the front page and a slice of the back page, flipped with backface-visibility.', 'radial-gradient(circle at 30% 35%,#f1d58d,#d79d58 45%,#8a5434)'],
  ['Night garden', 'Shading and a soft highlight follow each strip’s angle to the light, so the curl reads as a surface.', 'radial-gradient(circle at 70% 30%,#fff3c4 0 6%,#2f3f6b 7%,#151d38)'],
  ['The end', 'Throw the page and its speed decides whether it turns or falls back.', 'linear-gradient(135deg,#e8e1d1,#c7b9a0)'],
];
const spreadHTML = (i) => {
  const [t, p, plate] = SPREADS[i];
  return `<div class="sp"><div class="pg l"><h2>${t}</h2><p>${p}</p><span class="no">${2 * i + 1}</span></div>
    <div class="pg r"><div class="plate" style="background:${plate}"></div><span class="no">${2 * i + 2}</span></div></div>`;
};
const N = 16, BETA = 0.62;   // strips, peak curl (rad)
const book = document.getElementById('book'), stage = document.getElementById('stage');
let at = 0, turn = null, strips = [];
const el = (t, c, html) => { const e = document.createElement(t); if (c) e.className = c; if (html) e.innerHTML = html; return e; };
function half(side, i) { const h = el('div', 'half ' + side); const a = el('div', 'art', spreadHTML(i)); h.append(a); return h; }
function paint() {
  book.innerHTML = '';
  // under a turn the static halves show: left = from-spread (next) or to-spread (prev), right = to (next) / from (prev)
  if (!turn) { book.append(half('left', at), half('right', at)); return; }
  const { dir, from, to } = turn;
  book.append(half('left', dir > 0 ? from : to), half('right', dir > 0 ? to : from));
  book.append(buildCurl(dir, from, to));
}
// the leaf: N strips nested; strip i shows columns i/N..(i+1)/N of the page.
// front face = the turning half of the from-spread; back face = the matching half of the to-spread.
function buildCurl(dir, from, to) {
  strips = [];
  const curl = el('div', 'curl ' + (dir > 0 ? 'next' : 'prev'));
  const W = stage.clientWidth / 2, sw = W / N;
  let parent = curl;
  for (let i = 0; i < N; i++) {
    const s = el('div', 'strip'); s.style.width = sw + 'px';
    const front = el('div', 'face front'), back = el('div', 'face back');
    // offset of this column inside the full-spread picture (picture is 2W wide)
    const colFront = dir > 0 ? W + i * sw : W - (i + 1) * sw;          // from-spread's right half (next) / left half (prev)
    const colBack = dir > 0 ? W - (i + 1) * sw : W + i * sw;           // to-spread's left half (next) / right half (prev)
    const af = el('div', 'art', spreadHTML(from)); af.style.width = 2 * W + 'px'; af.style.left = -colFront + 'px';
    const ab = el('div', 'art', spreadHTML(to)); ab.style.width = 2 * W + 'px'; ab.style.left = -colBack + 'px';
    front.append(af, el('div', 'sh'), el('div', 'gl')); back.append(ab, el('div', 'sh'), el('div', 'gl'));
    s.append(front, back); parent.append(s); parent = s; strips.push(s);
  }
  return curl;
}
// t in [0, 1]: progress of the turn. The root strip turns by π·t; the curl (extra bend per strip)
// rises and falls as sin(π·t), so a flat page lifts, bends, and lands flat on the other side.
function applyTurn(t) {
  const dir = turn.dir, root = Math.PI * t, bend = BETA * Math.sin(Math.PI * t) / N;
  strips.forEach((s, i) => {
    const a = i === 0 ? root : bend;                      // child strips add only the extra bend
    s.style.transform = `rotateY(${(dir > 0 ? -1 : 1) * a}rad)`;
    const total = root + bend * i, facing = Math.abs(Math.cos(total));   // how squarely this strip faces the light
    for (const f of s.children) {
      f.querySelector('.sh').style.opacity = (0.32 * (1 - facing)).toFixed(3);
      f.querySelector('.gl').style.opacity = (0.5 * Math.pow(facing, 8) * Math.sin(Math.PI * t)).toFixed(3);
    }
  });
}
// —— motion: a spring toward 0 (fall back) or 1 (commit) ——
let t = 0, v = 0, target = 0, raf = 0, last = 0;
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
function tick(now) {
  const dt = Math.min(0.033, (now - last) / 1000 || 0.016); last = now;
  if (REDUCED) { t = target; v = 0; } else { for (let k = 0; k < 4; k++) { v += ((target - t) * 120 - v * 18) * dt / 4; t += v * dt / 4; } }
  applyTurn(Math.min(1, Math.max(0, t)));
  if (Math.abs(target - t) < 0.002 && Math.abs(v) < 0.01) { finish(); return; }
  raf = requestAnimationFrame(tick);
}
function finish() { raf = 0; if (target === 1) at = turn.to; turn = null; paint(); }
function start(dir) {
  const to = at + dir; if (to < 0 || to >= SPREADS.length || turn) return false;
  turn = { dir, from: at, to }; t = 0; v = 0; paint(); applyTurn(0); return true;
}
function go(dir) { if (start(dir)) { target = 1; last = performance.now(); raf = requestAnimationFrame(tick); } }
// drag: progress follows the pointer across the spread; release with speed decides commit vs fall back
let drag = null;
stage.addEventListener('pointerdown', (e) => {
  if (turn) return; const r = stage.getBoundingClientRect(), dir = e.clientX > r.left + r.width / 2 ? 1 : -1;
  if (!start(dir)) return; stage.setPointerCapture(e.pointerId); drag = { x0: e.clientX, w: r.width, lx: e.clientX, lt: performance.now(), vx: 0 };
});
stage.addEventListener('pointermove', (e) => {
  if (!drag) return; const now = performance.now();
  drag.vx = (e.clientX - drag.lx) / Math.max(1, now - drag.lt); drag.lx = e.clientX; drag.lt = now;
  t = Math.min(1, Math.max(0, (turn.dir > 0 ? drag.x0 - e.clientX : e.clientX - drag.x0) / drag.w)); applyTurn(t);
});
const release = () => {
  if (!drag) return; const fling = (turn.dir > 0 ? -drag.vx : drag.vx);   // px/ms toward the turn
  target = (t > 0.5 || fling > 0.6) && fling > -0.4 ? 1 : 0; v = fling * 2; drag = null; last = performance.now(); raf = requestAnimationFrame(tick);
};
stage.addEventListener('pointerup', release); stage.addEventListener('pointercancel', release);
addEventListener('keydown', (e) => { if (e.key === 'ArrowRight') go(1); if (e.key === 'ArrowLeft') go(-1); });
addEventListener('resize', () => { if (!turn) paint(); });
paint();
window.__book = { go, setT: (x) => { if (!turn) start(1); t = x; applyTurn(x); } };   // test hook
</script>
</body>
</html>
