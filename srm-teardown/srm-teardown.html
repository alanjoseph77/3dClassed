/* HUD chrome shared by every sim. 1rem = 10px at the 1080x1350 reference
   size; runtime sets html font-size from the viewport so it scales. */

:root {
  --bg: #09090a;
  --fg: #ece6d6;
  --dim: rgba(236, 230, 214, 0.64);
  --mute: rgba(236, 230, 214, 0.38);
  --faint: rgba(236, 230, 214, 0.16);
  --line: rgba(236, 230, 214, 0.14);
  --panel: rgba(9, 9, 10, 0.9);
  --accent: #f2b632;
  --top: 13.4rem;
  --bot: 30.5rem;
}
:root[data-theme='light'] {
  --bg: #f3f2ee;
  --fg: #151515;
  --dim: rgba(21, 21, 21, 0.66);
  --mute: rgba(21, 21, 21, 0.42);
  --faint: rgba(21, 21, 21, 0.16);
  --line: rgba(21, 21, 21, 0.16);
  --panel: rgba(243, 242, 238, 0.93);
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
#app {
  position: fixed; inset: 0; color: var(--fg);
  font-family: 'JetBrains Mono', ui-monospace, monospace;
  font-variant-ligatures: none; -webkit-font-smoothing: antialiased;
}
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.hud { position: absolute; inset: 0; pointer-events: none; }
.hud.hidden { display: none; }
.accent { color: var(--accent); }

/* header */
.hdr {
  position: absolute; left: 0; right: 0; top: 0; height: var(--top);
  padding: 2.4rem 2.8rem 0;
  background: linear-gradient(var(--bg) 0%, var(--bg) 78%, transparent 100%);
}
.row { display: flex; align-items: baseline; white-space: nowrap; }
.row1 { gap: 5.6rem; }
.title { display: flex; align-items: center; gap: 1.3rem; font-size: 3.6rem; font-weight: 600; letter-spacing: 0.04em; }
.title .bar { display: inline-block; width: 0.75rem; height: 3.6rem; background: var(--accent); }
.sub { font-size: 1.75rem; color: var(--dim); letter-spacing: 0.08em; }
.right { margin-left: auto; font-size: 1.6rem; color: var(--dim); letter-spacing: 0.1em; }
.row2 { margin-top: 2rem; font-size: 1.95rem; }
.row2 .stage { width: 21rem; letter-spacing: 0.05em; }
.row2 .cmd { color: var(--fg); }
.row2 .time { margin-left: auto; letter-spacing: 0.05em; }
.prog { position: absolute; left: 2.8rem; right: 2.8rem; bottom: 1.2rem; height: 0.35rem; }
.prog i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); }

/* viewport overlays */
.ann { position: absolute; inset: 0; overflow: hidden; }
.ann div {
  position: absolute; transform: translate(1.4rem, -50%); white-space: nowrap;
  font-size: 1.7rem; letter-spacing: 0.04em; color: var(--fg);
  text-shadow: 0 0 0.6rem var(--bg), 0 0 1.2rem var(--bg);
}
.ann div.a { color: var(--accent); }
.ann div.box {
  padding: 0.8rem 1.1rem; border: 1px solid var(--line); background: var(--panel);
  text-shadow: none; line-height: 1.45; font-size: 1.55rem;
}
.ann div.box b { color: var(--accent); font-weight: 600; }
.wm {
  position: absolute; right: 3rem; bottom: calc(var(--bot) + 1.6rem);
  font-size: 2.3rem; letter-spacing: 0.06em; color: var(--fg); opacity: 0.3;
}

/* bottom panel */
.bot {
  position: absolute; left: 0; right: 0; bottom: 0; height: var(--bot);
  display: flex; border-top: 1px solid var(--line); background: var(--panel);
  padding: 2rem 2.8rem 1.6rem;
}
.term { flex: 1; min-width: 0; display: flex; flex-direction: column; padding-right: 2.6rem; }
.thead { display: flex; align-items: baseline; gap: 2.4rem; font-size: 1.75rem; white-space: nowrap; }
.thead .host { font-size: 2.1rem; }
.thead .path { color: var(--dim); }
.thead .status { margin-left: auto; font-size: 1.5rem; letter-spacing: 0.1em; display: flex; align-items: center; gap: 0.9rem; }
.thead .status i { width: 1rem; height: 1rem; border-radius: 50%; background: var(--accent); display: inline-block; }
.prompt { margin-top: 1.9rem; font-size: 2.2rem; white-space: nowrap; overflow: hidden; }
.logs { margin-top: 1.1rem; font-size: 1.85rem; line-height: 1.52; flex: 1; overflow: hidden; }
.logs div { white-space: nowrap; overflow: hidden; text-overflow: clip; }
.logs .ln { color: var(--mute); display: inline-block; width: 6.4rem; }
.logs .hl { color: var(--accent); }
.caret { display: inline-block; width: 0.95em; height: 1.05em; vertical-align: -0.15em; background: var(--accent); margin-left: 0.15em; }
.tfoot { font-size: 1.35rem; color: var(--mute); white-space: nowrap; letter-spacing: 0.04em; }
.side {
  width: 31%; border-left: 1px solid var(--line); padding-left: 2.2rem;
  display: flex; flex-direction: column;
}
.shead { font-size: 1.45rem; letter-spacing: 0.12em; }
.mini { width: 100%; flex: 1; min-height: 0; display: block; margin: 0.8rem 0; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem 1.4rem; font-size: 1.35rem; color: var(--mute); }
.stats b { display: block; font-size: 2rem; color: var(--fg); font-weight: 600; letter-spacing: 0.02em; }
.sfoot { margin-top: 0.8rem; font-size: 1.3rem; color: var(--mute); letter-spacing: 0.05em; }
.baseline { position: absolute; left: 2.8rem; right: 2.8rem; bottom: 0.9rem; height: 0.25rem; background: var(--line); }
.baseline i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); }

/* director layers */
.dir-glitch { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.dir-flash {
  position: absolute; inset: 0; pointer-events: none; opacity: 0; mix-blend-mode: screen;
  background: radial-gradient(ellipse 75% 55% at 50% 45%, var(--accent) 0%, transparent 70%), rgba(255,255,255,0.18);
}
.dir-story {
  position: absolute; left: 0; right: 0; top: 0; bottom: 0; pointer-events: none;
  display: flex; align-items: flex-end; justify-content: center; padding: 0 4.5rem 6rem; opacity: 0;
}
.cap { text-align: center; max-width: 96rem; position: relative; }
.cap::before {
  content: ''; position: absolute; inset: -6rem -10rem; z-index: -1;
  background: radial-gradient(ellipse 50% 50% at 50% 55%, rgba(0,0,0,0.62) 0%, rgba(0,0,0,0) 100%);
}
:root[data-theme='light'] .cap::before { background: radial-gradient(ellipse 50% 50% at 50% 55%, rgba(243,242,238,0.8) 0%, rgba(243,242,238,0) 100%); }
.cap-main {
  font-family: 'Inter', 'Inter Variable', system-ui, sans-serif; font-weight: 800;
  font-size: 11.5rem; line-height: 0.98; letter-spacing: -0.035em; color: var(--fg);
  text-shadow: 0 0.4rem 2.4rem rgba(0,0,0,0.55);
}
.cap.num .cap-main { font-size: 15rem; font-variant-numeric: tabular-nums; letter-spacing: -0.045em; }
.cap-main .w { display: inline-block; transform-origin: 50% 70%; }
.cap-main .w.hl { background: var(--accent); color: #0a0a0a; padding: 0 0.14em; text-shadow: none; border-radius: 0.06em; }
.cap-sub {
  margin-top: 2rem; font-size: 2.7rem; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--fg); opacity: 0.85; min-height: 1.3em;
}
.cap-tag {
  display: inline-block; margin-bottom: 1.8rem; padding: 0.5rem 1.2rem; font-size: 2.2rem; letter-spacing: 0.12em;
  border: 1px solid var(--accent); color: var(--accent); background: rgba(0,0,0,0.5);
}

:root{--bg:#ecebe6;--panel:rgba(250,249,245,.93);--ink:#2b2926;--mute:#7d776c;--line:#d9d4c7;--acc:#ff5a1f}
html,body{background:var(--bg)}
#app{position:fixed;inset:0;color:var(--ink);font:13px/1.4 'Inter',system-ui,sans-serif;overflow:hidden}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#gl.drag{cursor:grabbing}
.top{position:absolute;left:24px;top:18px;pointer-events:none}
.top h1{margin:0;font:700 22px/1.15 'Inter',sans-serif;letter-spacing:-.01em}
.top p{margin:4px 0 0;color:var(--mute);font:500 12px 'JetBrains Mono',monospace}
.panel{position:absolute;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:0 10px 30px rgba(60,50,30,.1);backdrop-filter:blur(8px)}
.left{left:24px;top:84px;width:276px;display:flex;flex-direction:column;gap:12px}
.right{right:24px;top:18px;width:340px;max-height:calc(100% - 100px);overflow:auto}
.panel label{display:grid;grid-template-columns:1fr auto;gap:4px 8px;font-weight:600;font-size:12.5px}
.panel label input{grid-column:1/3}
output{font:600 12px 'JetBrains Mono',monospace;color:var(--mute)}
input[type=range]{width:100%;accent-color:var(--acc);height:26px;margin:0}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:3px;padding:3px;background:#e8e5dc;border-radius:10px}
.seg button{border:0;background:none;padding:9px;border-radius:8px;font:700 13px 'Inter',sans-serif;color:var(--mute);cursor:pointer}
.seg button[aria-pressed=true]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.chip{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:8px 13px;font:600 12.5px 'Inter',sans-serif;cursor:pointer;display:inline-flex;align-items:center;gap:6px;min-height:36px}
.chip:hover{border-color:#b9b2a2}
.chip[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip kbd{font:600 10.5px 'JetBrains Mono',monospace;opacity:.55}
.chip.ph i{width:10px;height:10px;border-radius:50%}
.row{display:flex;gap:8px;flex-wrap:wrap}.row.three{display:grid;grid-template-columns:repeat(3,1fr)}
.row.three .chip{justify-content:center}
.hint{margin:0;color:var(--mute);font-size:12px}
[hidden]{display:none!important}
.grid{display:grid;grid-template-columns:1.05fr 1.35fr .9fr 1fr;gap:6px;margin-bottom:10px}
.grid div{display:flex;flex-direction:column}
.grid i,.cur s,.lb span{opacity:1}
.grid i{font:600 10.5px 'JetBrains Mono',monospace;color:var(--mute);font-style:normal;text-transform:uppercase;letter-spacing:.05em}
.grid b{font:700 20px/1.2 'Inter',sans-serif;font-variant-numeric:tabular-nums;color:var(--ink);opacity:1}
.grid u{text-decoration:none;color:var(--mute);font:500 11px 'JetBrains Mono',monospace}
.cur{display:grid;gap:5px;margin-bottom:6px}
.cur div{display:grid;grid-template-columns:16px 1fr 58px;gap:8px;align-items:center;font:600 12px 'JetBrains Mono',monospace}
.cur em{height:8px;background:#e8e5dc;border-radius:4px;overflow:hidden;display:block}
.cur s{display:block;height:100%;width:0}
.cur b{text-align:right;font-weight:600;color:var(--ink);opacity:1}
.cur div:not(.on) b{color:var(--mute)}
.panel h3{margin:10px 0 4px;font:700 11px 'JetBrains Mono',monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.panel canvas{width:100%;height:auto;display:block}
.eq{margin:8px 0 0;font:600 13px 'JetBrains Mono',monospace;color:var(--mute);text-align:center}
.bottom{position:absolute;left:324px;right:384px;bottom:14px;display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.bottom .sp{width:10px}
.chip.tour{border-color:#e9d5c9;background:#fff6f1}
.chip.tour i{width:7px;height:7px;border-radius:50%;background:var(--acc);display:block}
.chip.tour.on i{animation:blink 1.2s steps(2) infinite}
@keyframes blink{50%{opacity:.15}}
.caption{position:absolute;left:50%;bottom:118px;transform:translateX(-50%);max-width:min(560px,calc(100% - 700px));padding:12px 18px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font:600 14px/1.45 'Inter',sans-serif;text-align:center;opacity:0;transition:opacity .4s;pointer-events:none}
.caption.on{opacity:1}
#labels{position:absolute;inset:0;pointer-events:none}
.lb{position:absolute;left:0;top:0;background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:8px;padding:5px 9px;font:600 12px 'Inter',sans-serif;white-space:nowrap}
.lb b{display:block;font-weight:700}.lb span{display:block;color:var(--mute);font:500 11px 'JetBrains Mono',monospace}
.lb svg{pointer-events:none}.lb line{stroke:#2b2926;stroke-width:1.2}
@media (max-width:1100px){
  .right{width:300px}
  .bottom{left:324px;right:344px}.caption{max-width:calc(100% - 660px)}
}
@media (max-width:860px){
  #app{overflow-y:auto;overflow-x:hidden;position:absolute;inset:0;height:auto;min-height:100%;display:flex;flex-direction:column}
  #gl{position:relative;height:62vh;min-height:360px;flex:none;order:1}
  .top{position:relative;order:0;left:0;top:0;padding:14px 16px 4px}.top h1{font-size:19px}
  .panel{position:relative;left:auto;right:auto;top:auto;width:auto;max-height:none;margin:10px 12px;order:3}
  .bottom{position:relative;left:auto;right:auto;bottom:auto;transform:none;order:2;max-width:none;min-width:0;padding:8px 12px;justify-content:flex-start;overflow-x:auto;flex-wrap:nowrap}
  .bottom .chip{flex:none}
  .caption{position:absolute;left:12px;right:12px;transform:none;max-width:none;bottom:auto;top:calc(62vh - 70px + 56px);font-size:13px}
  #labels{position:absolute;inset:auto;left:0;right:0;top:56px;height:62vh}
  .lb{font-size:11px}
}
@media (prefers-reduced-motion:reduce){.chip.tour.on i{animation:none}}
